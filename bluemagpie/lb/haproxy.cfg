# 青鳥 Magpie LB — HAProxy（由 install-lb.sh 以 VIP/NODE_A/NODE_B 代入）
global
    log stdout format raw local0
    maxconn 2000
defaults
    log global
    option  dontlognull
    timeout connect 3s
    timeout client  60s
    timeout server  60s
    default-server inter 3s fall 2 rise 2

# ---- 統計頁（區網） ----
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 5s

# ---- Home Assistant：主從（主節點優先，副節點 backup；WebSocket 需長連線） ----
frontend ha_http
    bind __VIP__:8123
    mode http
    option forwardfor
    timeout client 1h
    default_backend ha_nodes
backend ha_nodes
    mode http
    timeout server 1h
    timeout tunnel 1h
    option httpchk GET /api/
    http-check expect status 401
    server mac   __NODE_A__:8123 check
    server black __NODE_B__:8123 check backup

# ---- 後台 admin：主從 ----
frontend admin_http
    bind __VIP__:9000
    mode http
    default_backend admin_nodes
backend admin_nodes
    mode http
    option httpchk GET /api/health/self
    server mac   __NODE_A__:9000 check
    server black __NODE_B__:9000 check backup

# ---- Hermes：雙活（依來源 IP 黏著，確認對話不會跨節點） ----
frontend hermes_http
    bind __VIP__:8800
    mode http
    default_backend hermes_nodes
backend hermes_nodes
    mode http
    balance roundrobin
    stick-table type ip size 1k expire 15m
    stick on src
    option httpchk GET /v1/health
    server mac   __NODE_A__:8800 check
    server black __NODE_B__:8800 check

# ---- Whisper / Piper（Wyoming TCP）：雙活分流 ----
listen whisper_tcp
    bind __VIP__:10300
    mode tcp
    balance leastconn
    server mac   __NODE_A__:10300 check
    server black __NODE_B__:10300 check
listen piper_tcp
    bind __VIP__:10200
    mode tcp
    balance leastconn
    server mac   __NODE_A__:10200 check
    server black __NODE_B__:10200 check

# ---- Ollama：只有 Mac mini 有 GPU；副節點無（不列） ----
listen ollama_http
    bind __VIP__:11434
    mode http
    option httpchk GET /api/tags
    server mac   __NODE_A__:11434 check

# ---- LINE webhook / 機器人：主從 ----
frontend bot_http
    bind __VIP__:8900
    mode http
    default_backend bot_nodes
backend bot_nodes
    mode http
    option httpchk GET /v1/health
    server mac   __NODE_A__:8900 check
    server black __NODE_B__:8900 check backup
