# 青鳥 Magpie LB — keepalived VRRP（兩台只差 priority：主 150、副 100）
vrrp_script chk_haproxy {
    script "/usr/local/bin/check_haproxy.sh"
    interval 2
    weight -60          # HAProxy 掛了就讓出 VIP
    fall 2
    rise 2
}
vrrp_instance MAGPIE_VIP {
    state BACKUP        # 兩台都 BACKUP，由 priority 決定；避免搶回造成抖動時可加 nopreempt
    interface __IFACE__
    virtual_router_id __VRID__
    priority __PRIORITY__
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass __PASS__
    }
    virtual_ipaddress {
        __VIP__/24
    }
    track_script {
        chk_haproxy
    }
}
