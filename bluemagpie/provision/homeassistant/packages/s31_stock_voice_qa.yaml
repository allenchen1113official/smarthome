# file: packages/s31_stock_voice_qa.yaml
# 情境 31 股票語音問答：「2330 現在怎樣？」→ Hermes fast lane（唯讀、免確認、~1.9 s）
# HA 端不需要自動化；建議用 Siri 捷徑「股票」：聽寫文字 → POST 到 openclaw webhook。
# 本檔提供儀表板用的 Hermes 狀態感測器。
rest:
  - resource: http://192.168.0.8:8800/v1/health
    scan_interval: 60
    binary_sensor:
      - name: Hermes 線上
        unique_id: hermes_online
        value_template: "{{ value_json.ok }}"
        device_class: connectivity
    sensor:
      - name: Hermes world entities
        unique_id: hermes_world_entities
        value_template: "{{ value_json.world_entities }}"
